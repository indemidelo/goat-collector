name: Daily Goat Scan

on:
  schedule:
    # Ogni giorno alle 9:00 UTC. Modifica l'orario a piacere.
    - cron: "0 9 * * *"
  workflow_dispatch: {}  # permette anche l'avvio manuale da GitHub

permissions:
  contents: write  # necessario per poter salvare lo stato (data/state.db)

# Evita che due esecuzioni girino in parallelo (es. run manuale lanciato
# mentre quello schedulato è già in corso): la seconda aspetta che la prima
# finisca invece di girare in contemporanea e generare conflitti di push.
concurrency:
  group: daily-goat-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      # Se in futuro passi allo scraper con Playwright, scommenta:
      # - name: Installa browser Playwright
      #   run: playwright install --with-deps chromium

      - name: Esegui lo scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Salva lo stato aggiornato (mazzi/eventi visti, collezione, messaggi)
        run: |
          git config user.name "goat-collector-bot"
          git config user.email "actions@github.com"
          git add data/state.db
          if git diff --staged --quiet; then
            echo "Nessuna modifica da salvare."
            exit 0
          fi
          git commit -m "Aggiorna stato [skip ci]"

          # Rete di sicurezza extra: se il push viene comunque rifiutato
          # (es. race condition residua), riprova con pull --rebase.
          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rifiutato, riprovo con pull --rebase (tentativo $i)..."
            git pull --rebase origin main
          done
          git push
